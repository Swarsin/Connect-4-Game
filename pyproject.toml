[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "c4"
version = "0.1.0"
description = "Connect 4 engine, classic agents, AlphaZero training and evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "tqdm>=4.66",
]

[project.optional-dependencies]
train = ["torch>=2.1", "wandb>=0.16"]
eval = ["scipy>=1.11", "matplotlib>=3.8", "pandas>=2.0"]
export = ["onnx>=1.15", "onnxruntime>=1.17", "onnxscript>=0.1"]
interp = ["scikit-learn>=1.3"]
ppo = ["gymnasium>=0.29", "stable-baselines3>=2.2", "sb3-contrib>=2.2"]
dev = ["pytest>=7.4", "pytest-timeout>=2.2", "ruff>=0.4", "mypy>=1.8", "hypothesis>=6.90"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: long-running tests (deselect with -m 'not slow')",
    "torch: tests that need PyTorch",
    "solver: tests that need the external Pons solver binary",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["legacy", "third_party", "web", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
